apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliplot
  namespace: statex-apps
  labels:
    app: cliplot
    managed-by: codex
spec:
  # Single node, 110-pod ceiling: a second replica of a service with no
  # HA requirement buys nothing (both pods sit on the same node, so it is not
  # fault tolerance) and costs a slot that rollouts need for their surge pod.
  replicas: 1
  selector:
    matchLabels:
      app: cliplot
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxSurge 0: scaled to 1 replica on 2026-08-03 (both replicas sat on the
      # same single node, so it was never fault tolerance). With maxUnavailable 0
      # a 1-replica deployment still needs a free pod slot to roll, on a node
      # that hit its 110-pod ceiling mid-deploy. Rolling in place needs none.
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: cliplot
    spec:
      containers:
        - name: app
          image: localhost:5000/cliplot:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: cliplot-config
            - secretRef:
                name: cliplot-secret
                optional: true
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "256Mi"
              cpu: "250m"
